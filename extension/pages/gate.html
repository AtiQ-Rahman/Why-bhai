<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Why, bhai? — Why Bhai?</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    main { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
    h1 { font-size: 32px; }
    p { margin: 0; }
    #site { color: var(--muted); overflow-wrap: anywhere; }
    #site b { color: var(--text); }
    .step { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .q { font-size: 18px; font-weight: 800; }
    .mins { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .mins button { min-width: 72px; padding: 12px 10px; font-size: 18px; font-weight: 800; flex-direction: column; gap: 0; }
    .mins button small { font-size: 12px; font-weight: 600; color: var(--muted); }
    #note { max-width: 420px; }
    .breath-sub { color: var(--muted); font-size: 13px; }
    .chosen { font-size: 14px; color: var(--muted); }
    .chosen b { color: var(--text); }
    .custom { display: flex; gap: 8px; align-items: center; justify-content: center; }
    .custom[hidden] { display: none; }
    .custom input { width: 90px; text-align: center; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="../icons/icon128.png" alt="" width="56" height="56">
    <h1 id="title">Why, bhai?</h1>
    <p id="site"></p>

    <div class="step" id="ask" hidden>
      <div class="q">Did you get what you came for?</div>
      <p class="chosen" id="ask-why"></p>
      <div class="row"><button id="ask-yes">👍 Yes</button><button id="ask-no">🙃 Not really</button></div>
    </div>

    <p class="small muted" id="repeat" hidden></p>
    <button class="primary" id="begin" hidden>🌬️ Breathe first</button>

    <div class="breath-box" id="breath-box" hidden>
      <div class="breath" aria-hidden="true">
        <div class="breath-ring"></div>
        <div class="breath-ball" id="ball"></div>
        <div class="breath-count num" id="count"></div>
      </div>
      <div class="breath-label" id="label"></div>
      <div class="breath-sub" id="bsub"></div>
    </div>

    <div class="step" id="why" hidden>
      <div class="q">Why do you want to open it?</div>
      <p class="small muted">Not for anything real? Close it instead — that's a win.</p>
      <input type="text" id="note" maxlength="140" placeholder="e.g. reply to the class group, check the bus times" aria-label="Why">
      <button class="primary" id="note-next">Next</button>
    </div>

    <div class="step" id="long" hidden>
      <p class="chosen" id="chosen"></p>
      <div class="q">For how long?</div>
      <div class="mins" id="mins"></div>
      <div class="custom" id="custom">
        <input type="number" id="custom-min" min="1" max="30" step="1" inputmode="numeric" placeholder="Other" aria-label="Minutes">
        <span class="muted">min</span>
        <button id="custom-go">Open</button>
      </div>
      <p class="small muted">The clock ticks and the page stays black &amp; white. When time's up, it closes again.</p>
      <button class="ghost" id="long-back">← Change the reason</button>
    </div>

    <p class="error" id="err" hidden></p>
    <button class="ghost" id="skip" hidden>✕ Never mind, close it</button>
  </main>

  <script src="../shared.js"></script>
  <script type="module" src="gate.js"></script>
</body>
</html>
