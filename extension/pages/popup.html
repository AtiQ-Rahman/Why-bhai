<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Why Bhai?</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 330px; }
    .head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
    .head nav { display: flex; gap: 12px; }
    .head a { font-size: 13px; color: var(--muted); text-decoration: none; }
    .head a:hover { color: var(--text); }
    section { padding: 8px 16px 14px; }
    .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
    .empty { text-align: center; padding: 14px 6px; color: var(--muted); font-size: 13.5px; }
    .empty b { display: block; font-size: 22px; margin-bottom: 4px; color: var(--text); }
    .site { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
    .site + .site { border-top: 1px dashed var(--border); }
    .site .e { font-size: 20px; }
    .site .info { flex: 1; min-width: 0; }
    .site .d { display: block; font-weight: 700; font-size: 14px; color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site .d:hover, .site .d:focus-visible { text-decoration: underline; }
    .site .r { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .site .t { font-weight: 800; font-variant-numeric: tabular-nums; }
    .site .t.last { color: var(--danger); }
    .site button { padding: 4px 10px; font-size: 12px; border-radius: 999px; }
    #research { padding-bottom: 4px; }
    #research button.go { width: 100%; padding: 11px; font-weight: 700; }
    .rs { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); }
    .rs .info { flex: 1; min-width: 0; }
    .rs .d { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rs .r { font-size: 12px; color: var(--muted); }
    .rs .t { font-weight: 800; font-variant-numeric: tabular-nums; }
    .rs button { padding: 4px 10px; font-size: 12px; border-radius: 999px; }
    .toggles { border-top: 1px solid var(--border); padding: 6px 16px; }
    .tg { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; cursor: pointer; }
    .tg + .tg { border-top: 1px dashed var(--border); }
    .tg span { font-size: 14px; font-weight: 600; }
    .tg small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
    .tg input[type="checkbox"] { appearance: none; flex: none; width: 38px; height: 22px; border-radius: 999px; background: var(--bar-track); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
    .tg input[type="checkbox"]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
    .tg input[type="checkbox"]:checked { background: var(--accent); }
    .tg input[type="checkbox"]:checked::after { transform: translateX(16px); }
    .tg.vol { justify-content: flex-start; }
    .tg.vol input { flex: 1; accent-color: var(--accent); }
    #vol-val { width: 36px; text-align: right; }
    .today { border-top: 1px solid var(--border); padding: 10px 16px 12px; font-size: 12.5px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header class="head">
    <span class="brand"><img src="../icons/icon32.png" alt="">Why Bhai?</span>
    <nav><a href="stats.html" target="_blank">Stats</a><a href="#" id="open-options">Settings</a></nav>
  </header>

  <section id="research"></section>

  <section>
    <div class="label">Open right now</div>
    <div id="sites"></div>
  </section>

  <div class="toggles">
    <label class="tg"><span>⚫ Black &amp; white<small>Unlocked sites without color</small></span><input type="checkbox" id="grayscale"></label>
    <label class="tg vol"><span id="vol-icon">🔊</span><input type="range" id="volume" min="0" max="100" step="5" aria-label="Sound volume"><span class="num small muted" id="vol-val"></span></label>
  </div>

  <footer class="today" id="today"></footer>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
